<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Statistics</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>データ管理</h1>
            <div class="data-upload">
                <p>クリックまたはドラッグ&ドロップで<br>ファイルを選択</p>
                <p>対応形式: CSV, Excel (.xlsx, .xls)</p>
                <button>サンプルデータ読み込み</button>
                <button>データプレビュー</button>
            </div>
            <div class="data-cleaning">
                <h2>データクリーニング</h2>
                <label><input type="checkbox"> 空行を削除</label>
                <label><input type="checkbox"> 欠損値を処理</label>
                <label><input type="checkbox"> 数値データを標準化</label>
                <button>クリーニング実行</button>
            </div>
            <div class="analysis-history">
                <h2>処理履歴</h2>
                <!-- 分析履歴がここに表示されます -->
            </div>
        </div>
        <div class="main-content">
            <header>
                <nav>
                    <ul>
                        <li><a href="#">データ</a></li>
                        <li><a href="#">基本統計</a></li>
                        <li><a href="#">相関分析</a></li>
                        <li><a href="#">回帰分析</a></li>
                        <li><a href="#">因子分析</a></li>
                        <li><a href="#">因果分析</a></li>
                        <li><a href="#">レポート</a></li>
                    </ul>
                </nav>
            </header>
            <div class="result-display">
                <h1>結果表示</h1>
                <div class="welcome-message">
                    <img src="https://via.placeholder.com/150" alt="Co-Statistics Logo">
                    <h2>Co-Statistics</h2>
                    <p>統計分析ツール Cloud9版</p>
                    <p>左側のタブから機能を選択してください</p>
                </div>
                <!-- 分析結果がここに表示されます -->
            </div>
            <div class="recommendations">
                <h2>次の分析をレコメンド</h2>
                <!-- 次の分析レコメンデーションがここに表示されます -->
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
